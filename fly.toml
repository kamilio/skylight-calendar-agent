app = 'skylight-calendar-kjopek'
primary_region = 'ord'
kill_signal = 'SIGTERM'
kill_timeout = '60s'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  SKYLIGHT_MCP_HTTP_ALLOWED_HOSTS = 'skylight-calendar-kjopek.fly.dev'
  SKYLIGHT_MCP_HTTP_HOST = '::'
  SKYLIGHT_MCP_HTTP_PORT = '8080'
  SKYLIGHT_MCP_HTTP_PUBLIC_URL = 'https://skylight-calendar-kjopek.fly.dev/mcp'
  SKYLIGHT_MCP_HTTP_TRUST_PROXY = '1'
  SKYLIGHT_OAUTH_DB_PATH = '/data/oauth.sqlite'

[[mounts]]
  source = 'skylight_oauth_data'
  destination = '/data'

[processes]
  app = 'node --enable-source-maps docker-entrypoint.mjs'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 60
    soft_limit = 40

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
