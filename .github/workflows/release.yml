name: Publish npm package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.0
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@^11.15.0
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Select unpublished stable version
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          REMOTE_VERSION="$(npm view "$PACKAGE_NAME" version 2>/dev/null || echo 0.0.0)"
          LOCAL_VERSION="$(node -p "require('./package.json').version")"
          NEXT_VERSION="$(node -e '
            const parse = (value) => {
              if (!/^\d+\.\d+\.\d+$/.test(value)) throw new Error(`Stable semver required: ${value}`);
              return value.split(".").map(Number);
            };
            const remote = parse(process.argv[1]);
            const local = parse(process.argv[2]);
            const compare = (left, right) => left[0] - right[0] || left[1] - right[1] || left[2] - right[2];
            process.stdout.write(compare(local, remote) > 0
              ? local.join(".")
              : `${remote[0]}.${remote[1]}.${remote[2] + 1}`);
          ' "$REMOTE_VERSION" "$LOCAL_VERSION")"
          npm version --no-git-tag-version --allow-same-version "$NEXT_VERSION"
      - run: npm publish --provenance --access public --tag latest
